services:
  - type: web
    name: skill-swap-backend
    rootDir: backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false       # Paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false       # Set this to your Vercel app URL after frontend is deployed
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false       # Found in your Cloudinary dashboard → Settings → Product Environment
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false       # Your Gmail address
      - key: SMTP_PASS
        sync: false       # Gmail App Password
      - key: SMTP_FROM_NAME
        value: Skill Swap
      - key: SMTP_FROM_EMAIL
        sync: false       # Same as SMTP_USER or a custom sender
      - key: CONTACT_RECEIVER_EMAIL
        sync: false       # Email where contact/feedback messages are sent