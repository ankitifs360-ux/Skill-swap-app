<!DOCTYPE html>
<html>
<body>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY5YmU3YWYzOWI0ZGQ3NGYzZmE1ZDczMyIsImlhdCI6MTc3NDA5MTAyNCwiZXhwIjoxNzc0MTc3NDI0fQ.bAxmU8VGKBOxo7-7bLhAG5V6OsSZbNrheXp24uasOvk";
  const RECEIVER_ID = "69be7a989b4dd74f3fa5d72e";

  const socket = io("http://127.0.0.1:8000", {
    auth: {
      token: TOKEN
    },
    transports: ["websocket"]
  });

  socket.on("connect", () => {
    console.log("Connected:", socket.id);

    socket.emit("sendMessage", {
      receiver: RECEIVER_ID,
      message: "Hello from private chat"
    });
  });

  socket.on("receiveMessage", (data) => {
    console.log("Received:", data);
  });

  socket.on("messageError", (data) => {
    console.log("Message error:", data);
  });

  socket.on("connect_error", (error) => {
    console.log("Connect error:", error.message);
  });
</script>
</body>
</html>
